# Local demo overlay for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Two things differ from the production stack, and both are the reason a demo
# on http://localhost works at all:
#
# 1. ENVIRONMENT=development. The session cookie is issued with `secure=True`
#    in every other environment (see api/routers/auth.py), and a browser
#    refuses to store a Secure cookie over plain HTTP — so on the production
#    stack a login over http://localhost:8088 succeeds and is then immediately
#    forgotten. The same flag is what lets `scripts.seed_dev_data` run; it
#    refuses to touch a database that is not marked development.
#
# 2. The API is published on host port 8000. The production stack reaches the
#    backend only through Caddy, but the Vite dev server already proxies /api
#    to localhost:8000, so exposing it here means the demo front end needs no
#    configuration change to talk to the real stack.
#
# Never apply this overlay to anything reachable from outside the machine.

services:
  # MinIO's Docker Hub repositories now answer "pull access denied" for these
  # pinned releases. quay.io is MinIO's other official registry and serves the
  # identical tags, so the demo pulls from there. Same versions as the
  # production stack — only the registry changes.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z

  backend:
    environment:
      ENVIRONMENT: development
      # The dev server's origin is added so the API is usable directly from
      # :5173 as well as through Caddy on :8088.
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:8088},http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8000}:8080"
