# Cloudflare Pages configuration

name = "cod-commerce-platform"
account_id = ""
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"

# SPA fallback for client-side routing. API requests do not pass through Pages;
# the production bundle calls VITE_API_BASE_URL directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
